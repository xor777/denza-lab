<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400;500;700&amp;family=Roboto+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#07080A; font-family:'Roboto','Segoe UI',system-ui,sans-serif; }
    a { color:#FEEFAB; } a:hover { color:#FFF7D2; }
    .tile { position:relative; height:164px; box-sizing:border-box; border-radius:22px; padding:20px; display:flex; flex-direction:column; justify-content:space-between; }
    /* No corner mark. There used to be one on the four tiles whose long press led somewhere, in
       the convention a phone keyboard uses for a key with more characters under it; every tile
       has a panel now, so a mark saying so would be on all eleven and distinguish nothing.
       `DenzaTile` dropped it in the same change.

       THE TWO INKS UNDER A NAME, which is the only place this board spends colour on words:

         #FEEFAB  a LIVE tile whose line is a READING - what the feature is doing right now,
                  something that started when it started and stops when it stops.
                  "Приборы" (on the cluster), "Включены" (watching / showing), "+14°" (a fresh
                  reading handed to the car's own widget).
         #86909B  everything else. A SETTING - a choice the driver made, as true stopped as
                  running - or the switch said twice: "Включено" under a tile whose surface
                  already says it is on. Also every caption on an idle tile.

       That is `DenzaTileCaption` x `DenzaTileTone` in `captionColor()`, and it is why five
       tiles here read "Включено/Включена/Включены" in two different inks. Amber and coral
       belong to ATTENTION and BROKEN and are drawn on no tile of this board.

       A name is always full ink and an idle tile's glyph is always #86909B - being switched
       off is not a reason to stop saying which tile this is. */
    .on { background:#212429; border:1px solid rgba(254,239,171,0.30); box-shadow:0 0 22px rgba(254,239,171,0.07); }
    .off { background:#15181F; border:1px solid rgba(218,225,235,0.10); }
    .cap { font-size:15px; letter-spacing:1.6px; font-weight:500; color:#86909B; }
    .num { font-size:46px; font-weight:200; color:#DAE1EB; line-height:1; }
    .un { font-size:24px; color:#86909B; }
    .rate { font-size:19px; color:#FEEFAB; }
    .fig { display:flex; flex-direction:column; gap:8px; }
    .line { display:flex; align-items:baseline; gap:12px; }
    .ruled { border-top:1px solid rgba(218,225,235,0.14); padding-top:12px; }
    .nm { font-size:19px; font-weight:500; line-height:1.2; }
    .st { font-size:15px; line-height:1.3; }
    .led { font-family:'Roboto Mono',monospace; font-weight:700; font-size:34px; letter-spacing:5px; color:transparent; background-color:#FEEFAB; background-image:radial-gradient(circle at center, #FEEFAB 41%, transparent 46%); background-size:3.4px 3.4px; -webkit-background-clip:text; background-clip:text; filter:drop-shadow(0 0 7px rgba(254,239,171,0.55)); }
  </style>
</helmet>
<div style="width:1280px; height:680px; box-sizing:border-box; background:#07080A; display:flex; flex-direction:column; gap:12px; padding:20px 48px 12px 48px;">

  <div style="display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:12px;">

    <div class="tile on">
      <svg width="30" height="30" viewBox="1 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3"></circle><path d="M3.2 10.5 L9.1 10.9 M20.8 10.5 L14.9 10.9 M12 15 L12 21"></path></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Экран водителя</div>
        <div class="st" style="color:#FEEFAB;">Приборы</div>
      </div>
    </div>

    <div class="tile on">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h0.01"></path><path d="M2 16a4 4 0 0 1 4 4"></path><path d="M2 12a8 8 0 0 1 8 8"></path><path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"></path></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Трансляция</div>
        <div class="st" style="color:#86909B;">Выбрано 6</div>
      </div>
    </div>

    <!-- One dot, one meaning, and it is the chip's. The three that used to hang in this corner
         said nothing the code draws: `DenzaTile` has no dot at all, and `DenzaChip`'s single dot
         is the whole of what a chip says - is this on. Three of them here read as a carousel. -->
    <div class="tile on">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Зеркала</div>
        <div class="st" style="color:#FEEFAB;">Включены</div>
      </div>
    </div>

    <div class="tile on">
      <svg width="30" height="30" viewBox="1 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2"></rect><path d="M12 4.5v15"></path></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Разделение</div>
        <div class="st" style="color:#86909B;">Включено</div>
      </div>
    </div>

    <div class="tile on">
      <svg width="30" height="30" viewBox="3 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13.5l6-6 6 6"></path><path d="M5 19h14"></path></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Подсказки</div>
        <div class="st" style="color:#FEEFAB;">Включены</div>
      </div>
    </div>

    <div class="tile on">
      <svg width="30" height="30" viewBox="0.4 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3.2"></circle><path d="M8 2.4v1.4M8 12.2v1.4M2.4 8h1.4M12.2 8h1.4M4.6 4.6l1 1M11.4 4.6l-1 1M4.6 11.4l1-1"></path><path d="M17 20.5H9.5a3.5 3.5 0 0 1 0-7 4.6 4.6 0 0 1 8.7-1 3.9 3.9 0 0 1-1.2 8z"></path></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Погода</div>
        <div class="st" style="color:#FEEFAB;">+14°</div>
      </div>
    </div>

    <div class="tile on">
      <svg width="30" height="30" viewBox="4 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"></rect><circle cx="12" cy="14" r="3.2"></circle><circle cx="12" cy="7" r="1.2"></circle></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Динамики</div>
        <div class="st" style="color:#86909B;">Включена</div>
      </div>
    </div>

    <div class="tile on">
      <svg width="30" height="30" viewBox="1 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3.4 9.5h17.2M3.4 14.5h17.2"></path><path d="M12 3a15 15 0 0 0 0 18 15 15 0 0 0 0-18z"></path></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Русский язык</div>
        <div class="st" style="color:#86909B;">Включён</div>
      </div>
    </div>

    <div class="tile off">
      <svg width="30" height="30" viewBox="3 0 24 24" fill="none" stroke="#86909B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="2"></rect><path d="M12 6.5v7"></path><path d="M9 10.5l3 3 3-3"></path><path d="M9 17.5h6"></path></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Экран справа</div>
        <div class="st" style="color:#86909B;">Не выбрано</div>
      </div>
    </div>

    <div class="tile on">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><path d="m14.5 17.5 2 2 4-5"></path></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Приложения</div>
        <div class="st" style="color:#FEEFAB;">3 настроены</div>
      </div>
    </div>

    <div class="tile off">
      <svg width="30" height="30" viewBox="2 0 24 24" fill="none" stroke="#86909B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"></path><circle cx="15" cy="7" r="2" fill="#15181F"></circle><circle cx="8" cy="12" r="2" fill="#15181F"></circle><circle cx="17" cy="17" r="2" fill="#15181F"></circle></svg>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div class="nm" style="color:#DAE1EB;">Сервис</div>
        <div class="st" style="color:#86909B;">Всё в норме</div>
      </div>
    </div>

  </div>

  <!-- The strip. 32 between the analyser and the figures - the gap between two groups - which
       leaves the analyser 1184 - 320 - 32 = 832, and the column starts at 864.

       The bars fill that 832 exactly: 26 columns at 22.97 with 9.39 between them, which is the
       one pitch that keeps SpectrumRenderer.BAR_WIDTH_FRACTION and lands the last column on the
       right edge. Written to the hundredth on purpose - 22 and 9 left 37 dp of the column empty,
       and an analyser that stops short of its own field reads as a rendering fault.

       The texture inside a bar does NOT scale with it: the 4-unit crown, the 2 corner, the 11
       scanline pitch and the ticker's 3.4 dot cell are the same dp here, at 828 and at 416.
       Every width is laid out one unit to one dp, so a segment is the same size on the glass in
       all three; only the column gets narrower as the field does. See the README. -->
  <div style="flex-grow:1; display:flex; gap:32px; min-height:0;">

    <div style="flex-grow:1; display:flex; flex-direction:column; justify-content:flex-start; min-width:0;">
      <div style="display:flex; align-items:center; height:52px;">
        <div class="led">M83 · MIDNIGHT CITY</div>
      </div>
      <div style="position:relative;">
        <div style="display:flex; align-items:flex-end; gap:9.39px; height:202.98px;">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="26">
            <div style="width:22.97px; display:flex; flex-direction:column; justify-content:flex-end; height:202.98px;">
              <div style="height:4px; background:#FFF8DA; border-radius:2px; box-shadow:0 0 7px rgba(254,239,171,0.9); margin-bottom: {{b.p}}px;"></div>
              <div style="height: {{b.h}}px; border-radius:2px 2px 0 0; background:linear-gradient(to top, #4A4222, #FEEFAB 62%, #FFF8DA); box-shadow:0 0 16px rgba(254,239,171,0.22);"></div>
            </div>
          </sc-for>
        </div>
        <div style="position:absolute; left:0; right:0; bottom:0; height:202.98px; background:repeating-linear-gradient(to top, rgba(7,8,10,0) 0px, rgba(7,8,10,0) 8px, #07080A 8px, #07080A 11px); pointer-events:none;"></div>
      </div>
      <div style="height:40px; overflow:hidden; opacity:0.14; transform:scaleY(-1);">
        <div style="display:flex; align-items:flex-end; gap:9.39px; height:40px;">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="26">
            <div style="width:22.97px; height: {{b.h}}px; background:linear-gradient(to top, #4A4222, #FEEFAB 62%, #FFF8DA);"></div>
          </sc-for>
        </div>
      </div>
    </div>

    <!-- Three readings, one anatomy: a tracked capital over a large light figure with its unit
         beside it. The sunset used to be the odd one out - a sun in the vehicle's own amber, a 34
         where its neighbours were 46, and its word set as a unit instead of a label - so the one
         coloured caption on the screen was the one saying the sun goes down at the usual time.
         Amber means the car wants a decision. The label says which event this is; the glyph said
         it again, in the wrong colour. -->
    <div style="width:320px; flex-shrink:0; display:flex; flex-direction:column; justify-content:space-between;">
      <div class="fig">
        <div class="cap">В ПУТИ</div>
        <div class="line">
          <div class="num">1:42</div>
          <div class="un">128 км</div>
        </div>
      </div>
      <div class="fig ruled">
        <div class="cap">ВЫСОТА</div>
        <div class="line">
          <div class="num">642</div>
          <div class="un">м</div>
          <div style="display:flex; align-items:center; gap:8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FEEFAB" stroke-width="2.4" stroke-linecap="round"><path d="M12 19V6M6.5 11.5 12 6l5.5 5.5"></path></svg>
            <div class="rate">1,2</div>
          </div>
        </div>
      </div>
      <div class="fig ruled">
        <div class="cap">ЗАКАТ</div>
        <div class="line">
          <div class="num">19:44</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bars: [
        {h:30,p:13},{h:55,p:8},{h:91,p:17},{h:133,p:6},{h:160,p:11},{h:182,p:4},
        {h:164,p:14},{h:140,p:7},{h:112,p:16},{h:88,p:10},{h:124,p:5},{h:153,p:13},
        {h:177,p:4},{h:159,p:10},{h:131,p:17},{h:98,p:7},{h:78,p:12},{h:110,p:5},
        {h:136,p:14},{h:155,p:4},{h:138,p:11},{h:108,p:16},{h:82,p:7},{h:58,p:12},
        {h:82,p:5},{h:105,p:13}
      ]
    };
  }
}
</script>
</body>
</html>
