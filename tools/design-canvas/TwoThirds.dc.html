    .across { display:flex; align-items:stretch; height:72px; }
    .fig { flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
    /* Half the group gap either side, so the hairline has Space.XL of clear air across it. */
    .rule { width:1px; background:rgba(218,225,235,0.14); margin:0 16px; }
    .line { display:flex; align-items:baseline; gap:12px; }
    .num { font-size:46px; font-weight:200; color:#DAE1EB; line-height:1; }
    .un { font-size:24px; color:#86909B; }
    .rows { display:flex; flex-direction:column; gap:12px; }
    .row { height:30px; line-height:30px; display:flex; align-items:baseline; gap:12px; }
    .cap { font-size:15px; letter-spacing:1.6px; font-weight:500; color:#86909B; }
    /* The label's box plus the row's own gap is where every reading starts: 112. */
    .row .cap { width:100px; flex-shrink:0; }
    .val { font-size:24px; font-weight:300; color:#DAE1EB; }
    .rate { font-size:19px; color:#FEEFAB; }
  </style>
</helmet>
