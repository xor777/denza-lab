<title>Пилюля сплита</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ground: #05070a;
    --frame: #1c2433;
    --ink-2: #8793a4;
    --ink-3: #566174;
    --rule-2: #263246;
    --crown-ink: #c8e4ff;
    --stage: #000000;

    /* The pill's colours (--glass, --blue, --white and the rest) and every pill length and time
       below are custom properties the script sets from SPEC; this sheet has no pill number. */

    /* The car's own chrome. */
    --clock: rgba(255, 255, 255, 0.82);
    --grip: #5f646d;
    --dock-blob: rgba(255, 255, 255, 0.07);
    --dock-ink: rgba(255, 255, 255, 0.5);
    --split-off: rgba(255, 255, 255, 0.7);
    --home-tile: rgba(255, 255, 255, 0.06);
    --home-tile-2: rgba(255, 255, 255, 0.085);

    /* Apps. */
    --app-nav: #22998a;
    --app-music: #d0566b;
    --app-msg: #58a04f;
    --app-web: #5a68d6;
    --app-video: #d79a35;
    --app-pod: #9b5ec6;
    --bg-nav: #0a0f17;
    --bg-nav-day: #f1efea;
    --bg-music: #131217;
    --bg-msg: #0e1116;
    --bg-web: #f6f7f9;
    --bg-video: #050608;
    --bg-pod: #101115;
    --bg-pick: #0b0d11;

    --t-hi: rgba(255, 255, 255, 0.92);
    --t-mid: rgba(255, 255, 255, 0.6);
    --t-lo: rgba(255, 255, 255, 0.36);
    --t-line: rgba(255, 255, 255, 0.07);
    --t-fill: rgba(255, 255, 255, 0.14);
    --d-hi: #15181d;
    --d-mid: #4b5260;
    --d-lo: #8a919e;
    --d-line: #e2e5ea;
    --d-fill: #eceef2;
    --paper: #ffffff;
    --x-dark: rgba(0, 0, 0, 0.34);
    --x-light: rgba(20, 24, 32, 0.08);
    --x-ink-light: #3c4350;

    --art-1: radial-gradient(circle at 28% 30%, #ffb08a 0, transparent 38%), radial-gradient(circle at 72% 74%, #6a3cc9 0, transparent 52%), linear-gradient(135deg, #d0566b, #3b2a6b);
    --art-2: radial-gradient(circle at 70% 30%, #9be3d4 0, transparent 40%), linear-gradient(160deg, #22998a, #12324a);
    --art-3: radial-gradient(circle at 30% 70%, #ffd38a 0, transparent 45%), linear-gradient(200deg, #d79a35, #5a2c1c);
    --art-4: radial-gradient(circle at 60% 40%, #b9c3ff 0, transparent 42%), linear-gradient(140deg, #5a68d6, #1b1f4a);
    --art-5: radial-gradient(circle at 40% 35%, #f0b8ff 0, transparent 40%), linear-gradient(120deg, #9b5ec6, #2b1840);
    --mu-glow: rgba(208, 86, 107, 0.22);

    --av-1: #b65f73; --av-2: #4f86c6; --av-3: #6a9b55; --av-4: #c08a3e; --av-5: #8a63b8; --av-6: #4aa39a;
    --bub-in: #1d222a;
    --bub-out: #2c5732;
    --msg-sel: rgba(255, 255, 255, 0.05);
    --online: #6cc47a;

    --v-sky: linear-gradient(180deg, #f2a66a 0%, #c0567a 42%, #3a2a5a 100%);
    --v-m1: #3b2c4f; --v-m2: #1c1828; --v-sun: #ffd39a; --v-road: #2a2536;

    /* Map, night. */
    --mn-bg: #0a0f17; --mn-bld: #111a27; --mn-bld2: #0e1621; --mn-park: #0d1f1b; --mn-water: #0b1b2d;
    --mn-rdc: #070b10; --mn-rd: #1b2535; --mn-majc: #070b10; --mn-maj: #26344a; --mn-hwc: #0a0e14; --mn-hw: #3a4560;
    --mn-rt: #3d8bff; --mn-rtc: #0c2a57; --mn-rtd: #2b3546; --mn-lbl: #66738a; --mn-halo: #0a0f17;
    --mn-acc: rgba(67, 159, 252, 0.16); --mn-arrow: #3d8bff; --mn-arrow-edge: #ffffff;
    --mn-card: #141b26; --mn-card-ink: #e9eef5; --mn-card-sub: #8c97a8;
    /* Map, day. */
    --md-bg: #f1efea; --md-bld: #e3e0d9; --md-bld2: #d9d5cd; --md-park: #cfe6c3; --md-water: #a9d1ee;
    --md-rdc: #d6d1c7; --md-rd: #ffffff; --md-majc: #cbc4b7; --md-maj: #ffffff; --md-hwc: #dcae55; --md-hw: #f8d47f;
    --md-rt: #2e7bf0; --md-rtc: #1a59c2; --md-rtd: #a8b4c6; --md-lbl: #7a7f88; --md-halo: #f1efea;
    --md-acc: rgba(46, 123, 240, 0.14); --md-arrow: #2e7bf0; --md-arrow-edge: #ffffff;
    --md-card: #ffffff; --md-card-ink: #15181d; --md-card-sub: #6d7480;
    --nv-turn: #1b7e72; --nv-turn-ink: #ffffff; --nv-sign: #ffffff; --nv-sign-ring: #e0443e; --nv-sign-ink: #15181d;
    --nv-shadow: rgba(0, 0, 0, 0.28);

    --sans: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  html, body { margin: 0; background: var(--ground); }
  body { font-family: var(--sans); color: var(--crown-ink); }

  .sp-page {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(16px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-bottom, 0px));
    display: grid;
    justify-items: center;
    gap: 14px;
    overflow-x: clip;
  }
  .sp-wrap {
    position: relative;
    width: min(100%, max(360px, calc((100svh - 132px) * 1.6)));
    aspect-ratio: 16 / 10;
    border-radius: 14px;
    overflow: hidden;
    background: var(--stage);
    box-shadow: 0 0 0 1px var(--frame);
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .sp-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--stage-w);
    height: var(--stage-h);
    transform-origin: 0 0;
    background: var(--stage);
    overflow: hidden;
    font-family: var(--sans);
    color: var(--t-hi);
  }
  .sp-stage button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .sp-stage button:focus { outline: none; }

  /* Status bar and dock. */
  .sb {
    position: absolute; left: 0; top: 0; width: var(--stage-w); height: var(--pane-top);
    display: grid; place-items: center;
    font-size: 15px; font-weight: 500; letter-spacing: 0.02em;
    color: var(--clock);
    font-variant-numeric: tabular-nums;
  }
  .dock {
    position: absolute; left: 0; top: 736px; width: 1280px; height: 64px;
    display: flex; justify-content: center; align-items: center; gap: 36px;
  }
  .dk {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--dock-blob);
    display: grid; place-items: center;
  }
  .dk svg { width: 22px; height: 22px; fill: none; stroke: var(--dock-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .dk-split { position: relative; }
  .dk-split::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; }
  .dk-split svg { stroke: var(--split-off); transition: stroke .24s ease, filter .24s ease; }
  .dk-split.on svg { stroke: var(--blue); filter: drop-shadow(0 0 3px var(--blue-haze)); }

  /* Home screen. */
  .home { position: absolute; left: 0; top: 56px; width: 1280px; height: 680px; }
  .home i {
    position: absolute; width: 132px; height: 132px; border-radius: 30px; background: var(--home-tile);
  }
  .home i.w { width: 296px; background: var(--home-tile-2); }

  /* Panes. */
  .panes { position: absolute; inset: 0; }
  .pane {
    position: absolute; left: 0; top: var(--pane-top); width: var(--stage-w); height: var(--pane-h);
    overflow: hidden;
  }
  .pane-bg { position: absolute; inset: 0; }
  .pc {
    position: absolute; left: 0; top: 0; height: var(--pane-h); overflow: hidden;
    transform-origin: 50% 50%;
  }
  .pc > div { position: absolute; inset: 0; }
  .grip { position: absolute; left: 0; top: 0; width: var(--grip-w); height: var(--grip-h); border-radius: var(--grip-r); background: var(--grip); }

  .pc-x {
    position: absolute; top: 14px; right: 14px; width: 36px; height: 36px; border-radius: 50%;
    background: var(--x-dark); display: grid; place-items: center; z-index: 4;
  }
  .pc-x::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; }
  .pc-x svg { width: 18px; height: 18px; fill: none; stroke: var(--t-hi); stroke-width: 1.75; stroke-linecap: round; }
  .pc-x.lt { background: var(--x-light); }
  .pc-x.lt svg { stroke: var(--x-ink-light); }

  .gl { fill: none; stroke: var(--white); stroke-width: 1.62; stroke-linecap: round; stroke-linejoin: round; }
  .ic { display: block; overflow: visible; }

  /* Picker in an empty pane. */
  .pick { background: var(--bg-pick); }
  .pk {
    position: absolute; height: 112px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    touch-action: none;
  }
  .pk-ic { display: block; width: 64px; height: 64px; }
  .pk-n { font-size: 14px; color: var(--t-mid); }

  /* Navigator. */
  .nav { background: var(--bg-nav); }
  .nav.day { background: var(--bg-nav-day); }
  .map { position: absolute; left: 0; top: 0; display: block;
    --m-bg: var(--mn-bg); --m-bld: var(--mn-bld); --m-bld2: var(--mn-bld2); --m-park: var(--mn-park); --m-water: var(--mn-water);
    --m-rdc: var(--mn-rdc); --m-rd: var(--mn-rd); --m-majc: var(--mn-majc); --m-maj: var(--mn-maj); --m-hwc: var(--mn-hwc); --m-hw: var(--mn-hw);
    --m-rt: var(--mn-rt); --m-rtc: var(--mn-rtc); --m-rtd: var(--mn-rtd); --m-lbl: var(--mn-lbl); --m-halo: var(--mn-halo);
    --m-acc: var(--mn-acc); --m-arrow: var(--mn-arrow); --m-arrow-edge: var(--mn-arrow-edge);
  }
  .nav.day .map {
    --m-bg: var(--md-bg); --m-bld: var(--md-bld); --m-bld2: var(--md-bld2); --m-park: var(--md-park); --m-water: var(--md-water);
    --m-rdc: var(--md-rdc); --m-rd: var(--md-rd); --m-majc: var(--md-majc); --m-maj: var(--md-maj); --m-hwc: var(--md-hwc); --m-hw: var(--md-hw);
    --m-rt: var(--md-rt); --m-rtc: var(--md-rtc); --m-rtd: var(--md-rtd); --m-lbl: var(--md-lbl); --m-halo: var(--md-halo);
    --m-acc: var(--md-acc); --m-arrow: var(--md-arrow); --m-arrow-edge: var(--md-arrow-edge);
  }
  .m-bg { fill: var(--m-bg); }
  .m-bld { fill: var(--m-bld); }
  .m-bld2 { fill: var(--m-bld2); }
  .m-park { fill: var(--m-park); }
  .m-water { fill: none; stroke: var(--m-water); stroke-width: 58; stroke-linecap: round; }
  .m-rdc { fill: none; stroke: var(--m-rdc); stroke-width: 13; }
  .m-rd { fill: none; stroke: var(--m-rd); stroke-width: 10; }
  .m-majc { fill: none; stroke: var(--m-majc); stroke-width: 20; }
  .m-maj { fill: none; stroke: var(--m-maj); stroke-width: 17; }
  .m-hwc { fill: none; stroke: var(--m-hwc); stroke-width: 26; stroke-linecap: round; }
  .m-hw { fill: none; stroke: var(--m-hw); stroke-width: 21; stroke-linecap: round; }
  .m-rtd { fill: none; stroke: var(--m-rtd); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .m-rtc { fill: none; stroke: var(--m-rtc); stroke-width: 15; stroke-linecap: round; stroke-linejoin: round; }
  .m-rt { fill: none; stroke: var(--m-rt); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
  .m-lbl { font: 400 13px var(--sans); fill: var(--m-lbl); stroke: var(--m-halo); stroke-width: 3; paint-order: stroke; letter-spacing: 0.02em; }
  .m-acc { fill: var(--m-acc); }
  .m-arrow { fill: var(--m-arrow); stroke: var(--m-arrow-edge); stroke-width: 3; stroke-linejoin: round; }

  .nv-turn {
    position: absolute; left: 16px; top: 16px; width: 248px; height: 88px; border-radius: 14px;
    background: var(--nv-turn); color: var(--nv-turn-ink);
    display: flex; align-items: center; gap: 14px; padding: 0 18px; box-sizing: border-box;
    box-shadow: 0 6px 18px var(--nv-shadow);
  }
  .nv-turn svg { width: 44px; height: 44px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .nv-dist { font-size: 30px; font-weight: 500; line-height: 1; }
  .nv-street { font-size: 15px; opacity: 0.85; margin-top: 6px; white-space: nowrap; }
  .nv-sign {
    position: absolute; left: 16px; width: 52px; height: 52px; border-radius: 50%;
    background: var(--nv-sign); box-shadow: inset 0 0 0 5px var(--nv-sign-ring), 0 4px 12px var(--nv-shadow);
    display: grid; place-items: center; font-size: 20px; font-weight: 500; color: var(--nv-sign-ink);
  }
  .nv-zoom {
    position: absolute; right: 16px; top: 250px; width: 48px; height: 104px; border-radius: 24px;
    background: var(--mn-card); box-shadow: 0 4px 14px var(--nv-shadow);
    display: grid; grid-template-rows: 1fr 1fr; place-items: center;
  }
  .nv-zoom svg { width: 20px; height: 20px; fill: none; stroke: var(--mn-card-ink); stroke-width: 1.8; stroke-linecap: round; }
  .nav.day .nv-zoom { background: var(--md-card); }
  .nav.day .nv-zoom svg { stroke: var(--md-card-ink); }
  .nv-eta {
    position: absolute; left: 16px; bottom: 16px; height: 64px; border-radius: 16px;
    background: var(--mn-card); box-shadow: 0 6px 18px var(--nv-shadow);
    display: flex; align-items: center; gap: 16px; padding: 0 20px; box-sizing: border-box;
  }
  .nv-eta b { font-size: 24px; font-weight: 500; color: var(--online); }
  .nv-eta span { font-size: 16px; color: var(--mn-card-sub); white-space: nowrap; }
  .nav.day .nv-eta { background: var(--md-card); }
  .nav.day .nv-eta span { color: var(--md-card-sub); }

  /* Music. */
  .mu { background: radial-gradient(130% 62% at 50% 0%, var(--mu-glow) 0%, transparent 70%), var(--bg-music); }
  .mu > * { position: absolute; }
  .mu-lbl { font-size: 13px; letter-spacing: 0.04em; color: var(--t-lo); }
  .mu-art { border-radius: 14px; background: var(--art-1); box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45); }
  .mu-art::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
    background: repeating-radial-gradient(circle at 50% 50%, transparent 0 9px, rgba(255, 255, 255, 0.07) 9px 10px); }
  .mu-t { font-size: 22px; font-weight: 500; color: var(--t-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mu-a { font-size: 15px; color: var(--t-mid); white-space: nowrap; }
  .mu-bar { height: 4px; border-radius: 2px; background: var(--t-fill); }
  .mu-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: var(--t-hi); }
  .mu-bar b { position: absolute; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--white); }
  .mu-tm { font-size: 12px; color: var(--t-lo); font-variant-numeric: tabular-nums; }
  .mu-ic { width: 30px; height: 30px; fill: none; stroke: var(--t-hi); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .mu-play { border-radius: 50%; background: var(--white); display: grid; place-items: center; }
  .mu-play svg { width: 26px; height: 26px; fill: none; stroke: var(--bg-music); stroke-width: 2.6; stroke-linecap: round; }
  .mu-q { display: flex; gap: 14px; align-items: center; }
  .mu-q i { position: relative; width: 48px; height: 48px; border-radius: 8px; flex: none; }
  .mu-q b { display: block; font-weight: 400; font-size: 15px; color: var(--t-hi); white-space: nowrap; }
  .mu-q span { font-size: 13px; color: var(--t-lo); white-space: nowrap; }
  .mu-card i { display: block; width: 132px; height: 132px; border-radius: 10px; margin-bottom: 10px; }
  .mu-card b { display: block; font-weight: 400; font-size: 14px; color: var(--t-hi); white-space: nowrap; }
  .mu-card span { font-size: 12px; color: var(--t-lo); }

  /* Messenger. */
  .ms { background: var(--bg-msg); }
  .ms > * { position: absolute; }
  .ms-av { display: grid; place-items: center; border-radius: 50%; font-style: normal; font-weight: 500; color: var(--white); flex: none; }
  .ms-head { left: 0; top: 0; height: 72px; display: flex; align-items: center; gap: 12px; padding: 0 20px; box-sizing: border-box; border-bottom: 1px solid var(--t-line); }
  .ms-head b { display: block; font-weight: 500; font-size: 17px; color: var(--t-hi); }
  .ms-head span { font-size: 13px; color: var(--online); }
  .ms-thread { display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; overflow: hidden; }
  .bub { max-width: 76%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.35; color: var(--t-hi); background: var(--bub-in); align-self: flex-start; border-bottom-left-radius: 6px; }
  .bub.o { align-self: flex-end; background: var(--bub-out); border-bottom-left-radius: 18px; border-bottom-right-radius: 6px; }
  .bub small { display: block; text-align: right; font-size: 11px; color: var(--t-lo); margin-top: 2px; }
  .ms-input { height: 52px; border-radius: 26px; background: var(--bub-in); display: flex; align-items: center; justify-content: space-between; padding: 0 18px; box-sizing: border-box; font-size: 15px; color: var(--t-lo); }
  .ms-input svg { width: 22px; height: 22px; fill: none; stroke: var(--t-mid); stroke-width: 1.7; stroke-linecap: round; }
  .ms-list { left: 0; top: 0; bottom: 0; width: 300px; border-right: 1px solid var(--t-line); }
  .ms-list h4 { margin: 0; padding: 24px 20px 12px; font-size: 22px; font-weight: 500; color: var(--t-hi); }
  .ms-row { display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 16px 0 20px; }
  .ms-row.sel { background: var(--msg-sel); }
  .ms-row div { flex: 1; min-width: 0; }
  .ms-row b { display: block; font-weight: 500; font-size: 15px; color: var(--t-hi); }
  .ms-row span { display: block; font-size: 13px; color: var(--t-lo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ms-row em { font-style: normal; font-size: 12px; color: var(--t-lo); align-self: flex-start; margin-top: 18px; }

  /* Browser. */
  .wb { background: var(--bg-web); color: var(--d-hi); }
  .wb > * { position: absolute; }
  .wb-bar { left: 0; top: 0; height: 64px; background: var(--paper); border-bottom: 1px solid var(--d-line); display: flex; align-items: center; gap: 14px; padding: 0 16px; box-sizing: border-box; }
  .wb-bar > svg { width: 22px; height: 22px; fill: none; stroke: var(--d-mid); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .wb-url { flex: 1; height: 40px; border-radius: 20px; background: var(--d-fill); display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 14px; color: var(--d-mid); white-space: nowrap; overflow: hidden; margin-right: 52px; }
  .wb-url svg { width: 14px; height: 14px; fill: none; stroke: var(--d-lo); stroke-width: 2; flex: none; }
  .wb-k { font-size: 12px; letter-spacing: 0.08em; color: var(--d-lo); margin-bottom: 10px; }
  .wb-h { font-size: 26px; line-height: 1.22; font-weight: 500; margin: 0 0 18px; color: var(--d-hi); }
  .wb-img { border-radius: 10px; margin-bottom: 18px; background: linear-gradient(180deg, #bcd7ef 0%, #e9eef3 58%, #9aa6b4 58.5%, #7b8796 100%); position: relative; overflow: hidden; }
  .wb-img::before { content: ""; position: absolute; left: 8%; right: 8%; top: 42%; height: 9%; border-top: 3px solid #56606e; border-bottom: 2px solid #56606e; }
  .wb-img::after { content: ""; position: absolute; left: 0; right: 0; top: 46%; height: 14%; background: repeating-linear-gradient(90deg, transparent 0 9%, #56606e 9% 10%); opacity: 0.8; }
  .wb-p { font-size: 15px; line-height: 1.6; color: var(--d-mid); margin: 0 0 14px; }
  .wb-side h5 { margin: 0 0 12px; font-size: 13px; letter-spacing: 0.06em; font-weight: 500; color: var(--d-lo); }
  .wb-card { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--d-line); }
  .wb-card i { width: 64px; height: 48px; border-radius: 6px; flex: none; }
  .wb-card span { font-size: 14px; line-height: 1.4; color: var(--d-hi); }

  /* Video. */
  .vd { background: var(--bg-video); }
  .vd > * { position: absolute; }
  .vd-frame { border-radius: 12px; overflow: hidden; background: var(--v-sky); }
  .vd-frame svg.land { position: absolute; inset: 0; width: 100%; height: 100%; }

      (app ? `<button type="button" class="pc-x${isLight(app) ? ' lt' : ''}" aria-label="Закрыть">${X_BTN}</button>` : '');
    const rec = { el, w, app, day: S.day };
    if (below && p.contents.length) p.el.insertBefore(el, p.contents[0].el); else p.el.appendChild(el);
    p.contents.push(rec);
    p.cur = rec;
    p.bg.style.background = `var(${bgOf(app)})`;
    el.querySelectorAll('.pk').forEach(b => tapper(b, b.querySelector('.pk-ic'), () => pickApp(side, b)));
    const x = el.querySelector('.pc-x');
    if (x) tapper(x, x, () => { if (p.cur === rec) emptyPane(side, 'user'); });
    markDirty();
    return rec;
  }
  function drop(p, rec) {
    const i = p.contents.indexOf(rec);
    if (i >= 0) p.contents.splice(i, 1);
    rec.el.remove();
  }
  function retireOthers(p, keep, ms) {
    p.contents.filter(r => r !== keep).forEach(r => later(() => drop(p, r), ms));
  }
  function dropFly(p) {
    if (!p.fly) return;
    const f = p.fly;
    p.fly = null;
    f.classList.remove('rest');
    f.animate([{ opacity: 0 }], { duration: D(M.flyOut.ms), easing: css(M.flyOut.ease), fill: 'forwards' }).onfinish = () => f.remove();
  }
  function syncPane(side) {
    const p = PANES[side];
    p.tok++; dropFly(p); p.launching = false;
    if (!p.cur || p.cur.app !== S[side] || p.cur.w !== paneW(side) || (p.cur.app === 'nav' && p.cur.day !== S.day) || p.contents.length > 1) {
      p.contents.slice().forEach(r => drop(p, r));
      mount(side, S[side]);
    } else {
      p.cur.el.getAnimations().forEach(a => a.cancel());
    }
  }
  /** Re-lay a pane's content (new width or the map's day/night) as a crossfade. */
  function relayPane(side) {
    const p = PANES[side];
    if (p.launching || !p.cur) return;
    const rec = mount(side, p.cur.app);
    rec.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: D(GM.relay.ms), easing: css(GM.relay.ease) });
    retireOthers(p, rec, D(GM.relay.ms + G.retire));
  }

  /** An app icon flies from `from` (stage centre and size) to the pane, rests there while the app
   *  "launches", and dissolves into the app's screen. */
  function launch(side, app, from) {
    const p = PANES[side];
    const t = ++p.tok;
    dropFly(p);
    p.launching = true;
    const F = SPEC.fly, half = F.size / 2;
    const tx = paneCX(side, DIV()), ty = paneCY;
    const old = p.cur;
    const tf = D(M.flight.ms);
    let fly = null;
    const rest = `translate(${tx - half}px, ${ty - half}px) scale(1)`;
    if (from) {
      fly = document.createElement('div');
      fly.className = 'fly';
      fly.innerHTML = iconSVG(app, F.size);
      fx.appendChild(fly);
      p.fly = fly;
      const s0 = from.size / F.size;
      const c = { x: (from.x + tx) / 2, y: Math.min(from.y, ty) - F.arc };
      const kf = [];
      for (let i = 0; i <= F.samples; i++) {
        const u = i / F.samples, a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, cc = u * u;
        const x = a * from.x + b * c.x + cc * tx, y = a * from.y + b * c.y + cc * ty;
        kf.push({ transform: `translate(${(x - half).toFixed(2)}px, ${(y - half).toFixed(2)}px) scale(${(s0 + (1 - s0) * u).toFixed(4)})` });
      }
      fly.animate(kf, { duration: tf, easing: css(M.flight.ease), fill: 'forwards' });
    }
    if (old) old.el.animate([{ opacity: F.dim }], { duration: D(M.oldDim.ms), delay: tf * M.oldDim.at, easing: css(M.oldDim.ease), fill: 'forwards' });
    later(() => { if (p.tok === t && fly) fly.classList.add('rest'); }, tf);
    later(() => {
      if (p.tok !== t) return;
      p.launching = false;
      const rec = mount(side, app);
      rec.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: D(M.appIn.ms), easing: css(M.appIn.ease) });
      retireOthers(p, rec, D(M.appIn.ms + G.retire));
      if (fly) {
        fly.classList.remove('rest');
        if (p.fly === fly) p.fly = null;
        fly.animate([{ transform: rest, opacity: 1 }, { transform: `${rest} scale(${F.grow})`, opacity: 0 }], { duration: D(M.dissolve.ms), easing: css(M.dissolve.ease), fill: 'forwards' })
          .onfinish = () => fly.remove();
      }
    }, tf + D(TM.launchHold));
  }

  function emptyPane(side, reason) {
    if (!S[side] || S.home) return;
    S[side] = null;
    const p = PANES[side];
    p.tok++; dropFly(p); p.launching = false;
    const olds = p.contents.slice();
    mount(side, null, true);
    olds.forEach(r => {
      r.el.animate([{ opacity: 0, transform: `scale(${GM.empty.scale})` }], { duration: D(GM.empty.ms), easing: css(GM.empty.ease), fill: 'forwards' });
      later(() => drop(p, r), D(GM.empty.ms + G.retire));
    });
    dockUpdate();
    clock.cancel(T.repair);
    if (reason === 'plus') { showRepair(); return; }
    T.repair = later(() => { if (anyEmpty() && !S.home) showRepair(); }, D(TM.selfOpen));
  }
  function fillPane(side, app, from) {
    if (S[side]) return;
    S[side] = app;
    S.last[side] = app;
    if (S.left && S.right) makeCurrent(); else moveFront(S.hist[side], app);
    launch(side, app, from);
    dockUpdate();
    if (!anyEmpty()) {
      const g = items.get('ghost');
      if (g && S.mode !== 'handle') chipClose(g);
      closePill();
    }
    else if (S.mode !== 'handle') reconcile(repairSpec());
  }
  function pickApp(side, btn) {
    if (S[side]) return;
    const ic = btn.querySelector('.ic');
    const r = stageRect(ic);
    btn.querySelector('.pk-ic').style.opacity = '0';
    fillPane(side, btn.dataset.app, r);
  }

  // ---------------------------------------------------------------- press feedback
  function bloom(x, y) {
    if (reduced) return;
    const b = document.createElement('div');
    b.className = 'bloom';
    const B = SPEC.bloom;
    b.style.translate = `${x - B.size / 2}px ${y - B.size / 2}px`;
    fx.appendChild(b);
    b.animate([
      { opacity: 0, transform: `scale(${B.scale[0]})` },
      { opacity: 1, transform: `scale(${B.scale[1]})`, offset: B.peakAt },
      { opacity: 0, transform: `scale(${B.scale[2]})` },
    ], { duration: M.bloom.ms, easing: css(M.bloom.ease) }).onfinish = () => b.remove();
  }
  /** Feedback on pointerdown, the action on a clean release. */
  function tapper(el, face, onTap) {
    el.addEventListener('pointerdown', e => {
      if (e.button > 0) return;
      e.preventDefault();
      const p0 = toStage(e);
      bloom(p0.x, p0.y);
      face.animate([{ transform: `scale(${SPEC.press.scale})` }], { duration: D(M.tapPress.ms), easing: css(M.tapPress.ease), fill: 'forwards' });
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* fine */ }
      const up = ev => {
        if (ev.pointerId !== e.pointerId) return;
        el.removeEventListener('pointerup', up);
        el.removeEventListener('pointercancel', up);
        face.animate([{ transform: `scale(${SPEC.press.tapGrow})`, offset: SPEC.press.tapGrowAt }, { transform: 'scale(1)' }], { duration: D(M.tapRelease.ms), easing: css(M.tapRelease.ease), fill: 'forwards' });
        const p = toStage(ev);
        if (ev.type === 'pointerup' && Math.hypot(p.x - p0.x, p.y - p0.y) < SPEC.press.slop) onTap(ev);
      };
      el.addEventListener('pointerup', up);
      el.addEventListener('pointercancel', up);
    });
  }

  // ---------------------------------------------------------------- the pill's row
  const items = new Map();
  let rowSpec = [];
  function gapBetween(a, b) {
    if (a.kind === 'sep' || b.kind === 'sep') return RW.gap.sep;
    if (a.kind === 'chip' && b.kind === 'chip') return RW.gap.chip;
    if (a.kind === 'btn' && b.kind === 'btn') return RW.gap.btn;
    return RW.gap.other;
  }
  function layoutSpec(spec, edit) {
    const pad = edit ? RW.editPad : RW.pad;
    let x = pad, prev = null;
    const pos = new Map();
    for (const s of spec) {
      if (prev) x += gapBetween(prev, s);
      pos.set(s.key, x);
      x += s.w;
      prev = s;
    }
    const W = x + pad;
    for (const [k, v] of pos) pos.set(k, v - W / 2);
    return { W, pos };
  }
  function pairsSpec() {
    const edit = S.mode === 'edit';
    const pins = S.pinned.map(p => ({ key: 'pin:' + pk(p), kind: 'chip', w: CH.stacked, pair: p, pinned: true }));
    const recs = S.recents.filter(p => !isPinned(p)).map(p => ({ key: 'rec:' + pk(p), kind: 'chip', w: CH.stacked, pair: p, pinned: false }));
    const chips = pins.concat(recs).slice(0, edit ? Math.max(RW.maxChips, pins.length) : RW.maxChips);
    const out = chips.slice();
    if (chips.length) out.push({ key: 'sep', kind: 'sep', w: SPEC.sep.w });
    if (edit) out.push({ key: 'check', kind: 'btn', w: SPEC.btn.size });
    else out.push({ key: 'plus', kind: 'btn', w: SPEC.btn.size }, { key: 'star', kind: 'btn', w: SPEC.btn.size });
    return out;
  }
  function repairSpec() {
    const pair = [S.last.left, S.last.right];
    const g = { left: !S.left, right: !S.right };
    const out = [{ key: 'ghost', kind: 'chip', w: CH.open, pair, ghost: g, pinned: false }];
    const side = emptyTarget();
    const excl = new Set(pair);
    const cand = S.hist[side].concat(ORDER).filter((a, i, arr) => a && !excl.has(a) && arr.indexOf(a) === i).slice(0, RW.maxSingles);
    out.push({ key: 'sepR', kind: 'sep', w: SPEC.sep.w });
    cand.forEach(a => out.push({ key: 'one:' + a, kind: 'single', w: IC, app: a }));
    out.push({ key: 'sep', kind: 'sep', w: SPEC.sep.w }, { key: 'plus', kind: 'btn', w: SPEC.btn.size }, { key: 'star', kind: 'btn', w: SPEC.btn.size });
    return out;
  }
  const specNow = () => (S.content === 'repair' ? repairSpec() : pairsSpec());

  // A pair chip has two forms (SPEC.chip). Stacked: the right pane's app tucked behind the left one,
  // smaller, a cut-out ring between them. Opened: both side by side at full size, `gap` apart -
  // the form an incomplete pair takes, so the missing app's breathing contour is wholly visible.
  // `t` runs the form between the two; each side's `g` runs that app between solid and contour.
  const RI = SPEC.ghost.rimInset, RS = IC - 2 * RI, RR = SPEC.icon.radius - RI;
  const BACK = CH.back, OPEN_X = CH.inset + IC + CH.gap;
  const sideG = app => `<g class="solid">${iconInner(app)}</g>` +
    `<g class="ghost" filter="url(#sp-glow)" style="display:none"><rect class="gh-rim" x="${RI}" y="${RI}" width="${RS}" height="${RS}" rx="${RR}"/><g class="gl gh-gl" transform="translate(13 13) scale(1.0833)">${GLYPH[app]}</g></g>`;
  function chipHTML(s) {
    const [a, b] = s.pair;
    const R = SPEC.ring, rw = CH.stacked + 2 * R.out, rh = CH.h + 2 * R.out;
    return `<svg class="pair" viewBox="0 0 ${CH.open} ${CH.h}" width="${CH.open}" height="${CH.h}" aria-hidden="true">` +
      `<g class="ic-r" mask="url(#sp-cut)"><g class="ic-rt" transform="translate(${BACK.x} ${BACK.y}) scale(${BACK.scale})">${sideG(b)}</g></g>` +
      `<g class="ic-l" transform="translate(${CH.inset} ${CH.inset})">${sideG(a)}</g></svg>` +
      `<svg class="lp-ring" viewBox="0 0 ${rw} ${rh}" aria-hidden="true"><rect x="${R.inset}" y="${R.inset}" width="${rw - 2 * R.inset}" height="${rh - 2 * R.inset}" rx="${R.r}"/></svg>`;
  }
  const RIM = 2 * (RS - 2 * RR) * 2 + 2 * Math.PI * RR;   // the contour's perimeter
  const DASH = SPEC.ghost.dash;
  function rimDash(f) {
    if (f >= 0.999) return DASH.join(' ');
    const total = f * RIM, out = [];
    let acc = 0, dash = true;
    while (acc < total) {
      const d = Math.min(dash ? DASH[0] : DASH[1], total - acc);
      out.push(d.toFixed(2)); acc += d; dash = !dash;
    }
    if (!dash) out.push('0');   // ended on a gap: close the pair with an empty dash
    out.push((RIM + SPEC.ghost.tail).toFixed(0));
    return out.length > 1 ? out.join(' ') : `0 ${(RIM + SPEC.ghost.tail).toFixed(0)}`;
  }
  function chipForm(it) {
    const t = clamp(it.t.v, 0, CH.overshoot);
    const x = lerp(BACK.x, OPEN_X, t), y = lerp(BACK.y, CH.inset, clamp01(t)), s = lerp(BACK.scale, 1, clamp01(t));
    it.rt.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)}) scale(${s.toFixed(4)})`);
    // The mark and the press's origin sit under the middle of whatever the chip covers now.
    const c = lerp(CH.stacked / 2, CH.open / 2, clamp01(t));
    st(it.mark, 'translate', `${(c - SPEC.mark.w / 2).toFixed(2)}px 0px`);
    st(it.face, 'transformOrigin', `${c.toFixed(2)}px ${CH.h / 2}px`);
    for (const [gv, el] of [[it.gl, it.lg], [it.gr, it.rg]]) {
      const g = clamp01(gv.v);
      const solid = el.querySelector('.solid'), ghost = el.querySelector('.ghost');
      solid.setAttribute('opacity', clamp01(1 - g * SPEC.ghost.solidFade).toFixed(3));
      ghost.style.display = g > 0.002 ? '' : 'none';
      if (g > 0.002) {
        const rf = SPEC.ghost.rimFrom, gf = SPEC.ghost.glyphFrom;
        ghost.querySelector('.gh-rim').style.strokeDasharray = rimDash(clamp01((g - rf) / (1 - rf)));
        ghost.querySelector('.gh-gl').setAttribute('opacity', clamp01((g - gf) / (1 - gf)).toFixed(3));
      }
    }
  }
  /** Send a chip to the form its spec asks for: opened for an incomplete pair, stacked otherwise. */
  function chipTo(it, instant, delay = 0) {
    const g = it.s.ghost || {};
    const tl = g.left ? 1 : 0, tr = g.right ? 1 : 0, to = g.left || g.right ? 1 : 0;
    if (instant) { it.t.set(to); it.gl.set(tl); it.gr.set(tr); return; }
    if (it.t.target !== to) it.t.spring(to, SP.form, D(delay));
    if (it.gl.target !== tl) it.gl.tween(tl, D(M.ghostIn.ms), EASE[M.ghostIn.ease], D(delay));
    if (it.gr.target !== tr) it.gr.tween(tr, D(M.ghostIn.ms), EASE[M.ghostIn.ease], D(delay));
  }
  /** The ghost chip closing back into a stacked, solid pair as the pill melts. */
  function chipClose(it) {
    tw(it.gl, 0, M.ghostOut);
    tw(it.gr, 0, M.ghostOut);
    it.t.spring(0, SP.form);
  }
  const BTN = {
    plus: '<svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg>',
    star: `<svg class="star" viewBox="0 0 24 24"><path d="${STAR}"/></svg>`,
    check: '<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2L18.5 7.8"/></svg>',
  };

  function createItem(s) {
    const el = document.createElement('div');
    el.className = 'it it-' + s.kind;
    const H = RW.h[s.kind];
    el.style.width = s.w + 'px';
    el.style.height = H + 'px';
    const inn = document.createElement('div');
    inn.className = 'it-in';
    const face = document.createElement('div');
    face.className = 'it-face';
    el.appendChild(inn);
    if (s.kind !== 'sep') inn.appendChild(face);
    let mark = null;
    if (s.kind === 'chip') {
      face.innerHTML = chipHTML(s);
      mark = document.createElement('div');
      mark.className = 'mark';
      inn.appendChild(mark);
    } else if (s.kind === 'single') face.innerHTML = iconSVG(s.app, IC);
    else if (s.kind === 'btn') face.innerHTML = BTN[s.key];
    const it = { key: s.key, kind: s.kind, s, el, inn, face, mark, H, badge: null, badgeType: null, dragging: false };
    it.x = new V(0, v => st(el, 'translate', `${v.toFixed(2)}px ${-H / 2}px`), 0.05);
    it.sc = new V(1, v => st(face, 'scale', v.toFixed(4)), 0.0005);
    if (s.kind === 'chip') {
      it.pairKey = pk(s.pair);
      bindChipSvg(it);
      const form = () => chipForm(it);
      it.t = new V(0, form, 0.002);
      it.gl = new V(0, form, 0.002);
      it.gr = new V(0, form, 0.002);
      chipTo(it, true);
    }
    if (s.kind !== 'sep') el.addEventListener('pointerdown', e => onItemDown(it, e));
    row.appendChild(el);
    return it;
  }
  function updateItem(it, badgeDelay) {
    const s = it.s;
    if (it.kind === 'chip') {
      st(it.el, 'width', s.w + 'px');
      if (pk(s.pair) !== it.pairKey) {
        // The pair itself changed under a kept chip (a second pane refilled): redraw its icons.
        it.pairKey = pk(s.pair);
        const ring = it.face.querySelector('.lp-ring');
        it.face.innerHTML = chipHTML(s);
        if (ring) it.face.replaceChild(ring, it.face.querySelector('.lp-ring'));
        bindChipSvg(it);
        chipForm(it);
      }
      chipTo(it, false);
      it.el.classList.toggle('live', !s.ghost && isLive(s.pair));
      setBadge(it, S.mode === 'edit' && !s.ghost ? (s.pinned ? 'rm' : 'pin') : null, badgeDelay);
    }
    if (it.key === 'star') it.el.classList.toggle('solid', isPinned(currentPair()));
  }
  function bindChipSvg(it) {
    it.rt = it.face.querySelector('.ic-rt');
    it.rg = it.rt;
    it.lg = it.face.querySelector('.ic-l');
  }
  function setBadge(it, type, delay) {
    if (it.badgeType === type) return;
    if (it.badge) {
      const old = it.badge;
      old.style.pointerEvents = 'none';
      old.animate([{ transform: 'scale(0)', opacity: 0 }], { duration: D(M.badgeOut.ms), easing: css(M.badgeOut.ease), fill: 'forwards' }).onfinish = () => old.remove();
    }
    it.badge = null;
    it.badgeType = type;
    if (!type) return;
    const b = document.createElement('div');
    b.className = 'badge badge-' + type;
    b.innerHTML = type === 'rm' ? '<i></i>' : `<svg viewBox="0 0 24 24"><path d="${STAR}"/></svg>`;
    it.el.appendChild(b);
    it.badge = b;
    b.animate([
      { transform: 'scale(0)', opacity: 0 },
      { transform: `scale(${SPEC.enter.badgePeak})`, opacity: 1, offset: SPEC.enter.badgePeakAt },
      { transform: 'scale(1)', opacity: 1 },
    ], { duration: D(M.badgeIn.ms), delay: D(delay || 0), easing: css(M.badgeIn.ease), fill: 'backwards' });
    b.addEventListener('pointerdown', e => onBadgeDown(it, b, e));
  }
  function exitItem(it, mode) {
    it.el.style.pointerEvents = 'none';
    let a;
    if (mode === 'badge') {
      it.inn.style.transformOrigin = SPEC.enter.badgeOrigin.map(v => v + 'px').join(' ');
      a = it.inn.animate([{ transform: 'scale(0)', opacity: 0 }], { duration: D(M.unpin.ms), easing: css(M.unpin.ease), fill: 'forwards' });
      if (it.badge) it.badge.animate([{ transform: 'scale(0)', opacity: 0 }], { duration: D(M.unpinBadge.ms), delay: D(M.unpinBadge.delay), easing: css(M.unpinBadge.ease), fill: 'forwards' });
    } else {
      a = it.el.animate([{ opacity: 0, transform: `scale(${SPEC.enter.exit})` }], { duration: D(M.exit.ms), easing: css(M.exit.ease), fill: 'forwards' });
    }
    a.onfinish = () => it.el.remove();
  }
  function renameItem(from, to) {
    const it = items.get(from);
    if (!it || items.has(to)) return;
    items.delete(from);
    it.key = to;
    items.set(to, it);
  }
  function clearItems() {
    for (const it of items.values()) it.el.remove();
    items.clear();
    rowSpec = [];
  }
  /** Bring the row to `spec`: kept items glide to their new places, new ones come in, gone ones leave. */
  function reconcile(spec, opt = {}) {
    rowSpec = spec;
    const L = layoutSpec(spec, S.mode === 'edit');
    const keys = new Set(spec.map(s => s.key));
    for (const [k, it] of items) if (!keys.has(k)) { items.delete(k); exitItem(it, opt.exit && opt.exit[k]); }
    let chip = 0;
    spec.forEach((s, i) => {
      let it = items.get(s.key);
      const x = L.pos.get(s.key);
      if (!it) {
        it = createItem(s);
        items.set(s.key, it);
        it.x.set(x);
        if (opt.fresh) {
          it.inn.animate([{ opacity: 0, transform: `translateY(${SPEC.enter.dy}px)` }, { opacity: 1, transform: 'none' }],
            { duration: D(M.enter.ms), delay: D(M.enter.delay + i * M.enter.stagger), easing: css(M.enter.ease), fill: 'backwards' });
        } else {
          it.inn.animate([{ opacity: 0, transform: `scale(${SPEC.enter.pop})` }, { opacity: 1, transform: 'none' }],
            { duration: D(M.pop.ms), delay: D(opt.enterDelay || 0), easing: css(M.pop.ease), fill: 'backwards' });
        }
      } else if (!it.dragging) it.x.spring(x, SP.slide);
      it.s = s;
      updateItem(it, opt.stagger ? chip * M.badgeIn.stagger : 0);
      if (s.kind === 'chip') chip++;
    });
    P.w.spring(L.W, opt.wsp || (opt.fresh ? SP.open : SP.resize));
    return L;
  }

  // ---------------------------------------------------------------- pill lifecycle
  function startDim() {
    clock.cancel(T.dim);
    T.dim = later(() => { if (S.mode === 'handle') tw(P.hA, HD.dim, M.dim); }, TM.dim);
  }
  function wakeHandle() {
    if (P.hA.target < HD.alpha) tw(P.hA, HD.alpha, M.wake);
    if (S.mode === 'handle') startDim();
  }
  function armAuto() {
    clock.cancel(T.auto);
    if (S.mode === 'open' && S.content === 'pairs') T.auto = later(closePill, TM.auto);
  }
  function armEdit() { clock.cancel(T.edit); T.edit = later(exitEdit, TM.edit); }
  function pillTouched() { if (S.mode === 'open') armAuto(); if (S.mode === 'edit') armEdit(); }

  function openPill() {
    if (S.home) return;
    const closing = S.mode === 'handle' && items.size > 0;
    if (S.mode !== 'handle') { S.content = anyEmpty() ? 'repair' : S.content; reconcile(specNow()); armAuto(); return; }
    S.mode = 'open';
    S.content = anyEmpty() ? 'repair' : 'pairs';
    pill.classList.add('is-open');
    clock.cancel(T.clear); clock.cancel(T.dim);
    if (closing) { tw(P.rowA, 1, M.rowIn); reconcile(specNow(), { wsp: SP.open }); }
    else {
      clearItems(); P.rowA.set(1); reconcile(specNow(), { fresh: true });
      // Opening by itself on an emptied pane: the pair arrives stacked and whole, then opens up
      // and lets the missing app go to contour, so the change reads as it happens.
      const g = S.content === 'repair' && items.get('ghost');
      if (g) { g.t.set(0); g.gl.set(0); g.gr.set(0); chipTo(g, false, TM.ghostOpen); }
    }
    P.h.spring(PL.open.h, SP.openH);
    tw(P.o, 1, M.glassIn);
    P.hA.set(HD.alpha);
    armAuto();
  }
  function closePill() {
    if (S.mode === 'handle') return;
    S.mode = 'handle';
    pill.classList.remove('is-open');
    clock.cancel(T.auto); clock.cancel(T.edit);
    tw(P.rowA, 0, M.rowOut);
    P.w.spring(HD.w, SP.close, D(M.shrink.delay));
    P.h.spring(HD.h, SP.close, D(M.shrink.delay));
    tw(P.o, 0, M.glassOut);
    clock.cancel(T.clear);
    T.clear = later(() => { if (S.mode === 'handle') clearItems(); }, D(TM.clear));
    startDim();
  }
  function showRepair() {
    if (S.home) return;
    S.content = 'repair';
    clock.cancel(T.auto); clock.cancel(T.edit);
    if (S.mode === 'handle') { openPill(); return; }
    if (S.mode === 'edit') { S.mode = 'open'; P.h.spring(PL.open.h, SP.edit); }
    // The pair on screen becomes the incomplete pair: the same chip opens up in place.
    if (!items.has('ghost')) {
      const k = pk([S.last.left, S.last.right]);
      if (items.has('pin:' + k)) renameItem('pin:' + k, 'ghost');
      else if (items.has('rec:' + k)) renameItem('rec:' + k, 'ghost');
    }
    reconcile(repairSpec());
  }
  function enterEdit(lifted) {
    if (S.mode !== 'open' || S.content !== 'pairs') return;
    S.mode = 'edit';
    clock.cancel(T.auto);
    armEdit();
    reconcile(pairsSpec(), { stagger: true });
    P.h.spring(PL.edit.h, SP.edit);
    if (lifted) hideRing(lifted);
  }
  function exitEdit() {
    if (S.mode !== 'edit') return;
    S.mode = 'open';
    clock.cancel(T.edit);
    reconcile(pairsSpec());
    P.h.spring(PL.open.h, SP.edit);
    armAuto();
  }

  // ---------------------------------------------------------------- touches on the pill
  function startRing(it) {
    const svg = it.face.querySelector('.lp-ring'), r = svg.querySelector('rect');
    svg.getAnimations().forEach(a => a.cancel());
    svg.style.opacity = '1';
    return r.animate([{ strokeDashoffset: `${SPEC.ring.dash}px` }, { strokeDashoffset: '0px' }], { duration: D(M.ring.ms), delay: D(M.ring.delay), easing: css(M.ring.ease), fill: 'both' });
  }
  function hideRing(it) {
    const svg = it.face.querySelector('.lp-ring');
    if (!svg) return;
    svg.animate([{ opacity: 0 }], { duration: D(M.ringOut.ms), easing: css(M.ringOut.ease), fill: 'forwards' }).onfinish = () => {
      svg.getAnimations().forEach(a => a.cancel());
      svg.style.opacity = '0';
      svg.querySelector('rect').getAnimations().forEach(a => a.cancel());
    };
  }
  function nudge(it, to = SPEC.press.nudge) {
    tw(it.sc, to, M.nudge);
    later(() => it.sc.spring(1, SP.release), D(M.nudge.ms));
  }

  function onItemDown(it, e) {
    if (e.button > 0 || S.mode === 'handle' || S.home || it.el.style.pointerEvents === 'none') return;
    e.preventDefault();
    e.stopPropagation();
    pillTouched();
    const p0 = toStage(e), t0 = clock.now();
    bloom(p0.x, p0.y);
    try { it.el.setPointerCapture(e.pointerId); } catch (_) { /* fine */ }
    tw(it.sc, SPEC.press.scale, M.press);
    const isPair = it.kind === 'chip' && !it.s.ghost;
    const canLP = isPair && S.mode === 'open' && S.content === 'pairs';
    let moved = false, lpDone = false, dragging = false, ring = null;
    const tl = [];
    if (canLP) {
      ring = startRing(it);
      tl.push(clock.after(() => tw(it.sc, SPEC.press.lift, M.lift), TM.liftAt));
      tl.push(clock.after(() => { lpDone = true; enterEdit(it); }, TM.longPress));
    }
    const cancelLP = () => { tl.forEach(id => clock.cancel(id)); if (ring) { ring = null; hideRing(it); } };
    const move = ev => {
      if (ev.pointerId !== e.pointerId) return;
      const p = toStage(ev), dx = p.x - p0.x, dy = p.y - p0.y;
      if (dragging) { dragMove(it, dx); return; }
      if (isPair && S.mode === 'edit' && it.s.pinned && Math.abs(dx) > SPEC.drag.start) {
        dragging = true; cancelLP(); dragStart(it); dragMove(it, dx); return;
      }
      if (!lpDone && Math.hypot(dx, dy) > SPEC.press.move) { moved = true; cancelLP(); }
    };
    const up = ev => {
      if (ev.pointerId !== e.pointerId) return;
      it.el.removeEventListener('pointermove', move);
      it.el.removeEventListener('pointerup', up);
      it.el.removeEventListener('pointercancel', up);
      it.el.removeEventListener('lostpointercapture', up);
      if (dragging) { dragEnd(it); return; }
      if (lpDone) { it.sc.spring(1, SP.release); return; }
      cancelLP();
      it.sc.spring(1, SP.release);
      if (ev.type !== 'pointerup' || moved) return;
      if (canLP && clock.now() - t0 >= TM.tap) return;
      tapItem(it);
    };
    it.el.addEventListener('pointermove', move);
    it.el.addEventListener('pointerup', up);
    it.el.addEventListener('pointercancel', up);
    it.el.addEventListener('lostpointercapture', up);
  }
  function tapItem(it) {
    if (it.kind === 'chip') {
      if (it.s.ghost) restoreGhost(it);
      else if (S.mode === 'open') choosePair(it);
      return;
    }
    if (it.kind === 'single') { fillFromSingle(it); return; }
    if (it.key === 'plus') plusAction(it);
    else if (it.key === 'star') starAction(it);
    else if (it.key === 'check') exitEdit();
  }
  function onBadgeDown(it, b, e) {
    if (e.button > 0) return;
    e.preventDefault();
    e.stopPropagation();
    pillTouched();
    const p0 = toStage(e);
    bloom(p0.x, p0.y);
    b.animate([{ transform: `scale(${SPEC.press.badge})` }], { duration: D(M.badgePress.ms), easing: css(M.badgePress.ease), fill: 'forwards' });
    try { b.setPointerCapture(e.pointerId); } catch (_) { /* fine */ }
    const up = ev => {
      if (ev.pointerId !== e.pointerId) return;
      b.removeEventListener('pointerup', up);
      b.removeEventListener('pointercancel', up);
      b.animate([{ transform: 'scale(1)' }], { duration: D(M.badgeRelease.ms), easing: css(M.badgeRelease.ease), fill: 'forwards' });
      const p = toStage(ev);
      if (ev.type !== 'pointerup' || Math.hypot(p.x - p0.x, p.y - p0.y) > SPEC.press.slop || it.badge !== b) return;
      if (it.badgeType === 'rm') unpinChip(it); else pinChip(it);
    };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
  }

  function choosePair(it) {
    const pr = it.s.pair, go = [];
    SIDES.forEach((side, i) => {
      if (S[side] !== pr[i]) {
        const g = it.face.querySelector(i ? '.ic-r' : '.ic-l');
        go.push([side, pr[i], stageRect(g)]);
        g.style.opacity = '0';
      }
    });
    S.left = pr[0];
    S.right = pr[1];
    makeCurrent();
    dockUpdate();
    go.forEach(([side, app, r]) => launch(side, app, r));
    closePill();
  }
  function restoreGhost(it) {
    const pr = it.s.pair, back = [];
    SIDES.forEach((side, i) => { if (!S[side] && pr[i]) back.push([side, pr[i], i]); });
    if (!back.length) return;
    back.forEach(([side, app]) => { S[side] = app; });
    if (S.left && S.right) makeCurrent();
    dockUpdate();
    clock.cancel(T.repair);
    // The contour fills with the app's colour first, then the app flies; the pair closes back into
    // the stacked chip as the pill melts.
    const gs = back.map(([side, app, i]) => {
      tw(i ? it.gr : it.gl, 0, M.ghostOut);
      return [side, app, it.face.querySelector(i ? '.ic-r' : '.ic-l')];
    });
    later(() => {
      gs.forEach(([side, app, g]) => launch(side, app, stageRect(g)));
      if (!anyEmpty()) { it.t.spring(0, SP.form); closePill(); } else if (S.mode !== 'handle') reconcile(repairSpec());
    }, D(M.ghostOut.ms));
  }
  function fillFromSingle(it) {
    const side = emptyTarget();
    if (S[side]) return;
    const r = stageRect(it.face);
    it.face.style.opacity = '0';
    fillPane(side, it.s.app, r);
  }
  function plusAction(it) {
    const side = S.touched || wideSide();
    if (!S[side]) { nudge(it, SPEC.press.plusNudge); return; }
    emptyPane(side, 'plus');
  }
  function flashStar(it) {
    const svg = it.face.querySelector('svg');
    const K = SPEC.color, gw = SPEC.star.glow;
    const lit = `drop-shadow(0 0 ${gw[0]}px ${K.blue}) drop-shadow(0 0 ${gw[1]}px ${K.blue})`;
    const out = `drop-shadow(0 0 0 ${K['blue-clear']}) drop-shadow(0 0 0 ${K['blue-clear']})`;
    svg.animate([
      { color: K.crown, filter: lit },
      { color: K.crown, filter: lit, offset: SPEC.star.hold },
      { color: K.white, filter: out },
    ], { duration: D(M.starFlash.ms), easing: css(M.starFlash.ease) });
    tw(it.sc, SPEC.press.star, M.nudge);
    later(() => it.sc.spring(1, SP.release), D(M.nudge.ms));
  }
  function starAction(it) {
    const pr = currentPair();
    if (!pr[0] || !pr[1]) return;
    const key = 'pin:' + pk(pr);
    if (isPinned(pr)) {
      const chip = items.get(key);
      nudge(chip || it);
      return;
    }
    S.pinned.push(pr.slice());
    S.recents = S.recents.filter(q => !same(q, pr));
    renameItem('rec:' + pk(pr), key);
    reconcile(specNow());
    flashStar(it);
    const chip = items.get(key);
    if (chip) later(() => nudge(chip), D(TM.chipNudge));
  }
  function pinChip(it) {
    const pr = it.s.pair;
    if (isPinned(pr)) return;
    S.pinned.push(pr.slice());
    S.recents = S.recents.filter(q => !same(q, pr));
    renameItem(it.key, 'pin:' + pk(pr));
    reconcile(pairsSpec());
  }
  function unpinChip(it) {
    const pr = it.s.pair;
    S.pinned = S.pinned.filter(q => !same(q, pr));
    S.recents = S.recents.filter(q => !same(q, pr));
    S.recents.unshift(pr.slice());
    S.recents = S.recents.slice(0, SPEC.row.recents);
    reconcile(pairsSpec(), { exit: { [it.key]: 'badge' }, enterDelay: TM.unpinEnter });
  }

  // Reordering pinned chips in edit mode.
  function dragStart(it) {
    it.dragging = true;
    it.dragX0 = it.x.v;
    it.el.classList.add('drag');
    it.sc.spring(SPEC.drag.scale, SP.lift);
  }
  function dragMove(it, dx) {
    pillTouched();
    const pins = rowSpec.filter(s => s.kind === 'chip' && s.pinned);
    const L = layoutSpec(rowSpec, true);
    const slots = pins.map(s => L.pos.get(s.key));
    const x = clamp(it.dragX0 + dx, slots[0] - SPEC.drag.overshoot, slots[slots.length - 1] + SPEC.drag.overshoot);
    it.x.set(x);
    const cur = pins.findIndex(s => s.key === it.key);
    let best = cur, bd = Infinity;
    slots.forEach((sx, i) => { const d = Math.abs(sx - x); if (d < bd) { bd = d; best = i; } });
    if (cur >= 0 && best !== cur) {
      const pr = S.pinned.splice(cur, 1)[0];
      S.pinned.splice(best, 0, pr);
      reconcile(pairsSpec());
    }
  }
  function dragEnd(it) {
    it.dragging = false;
    it.el.classList.remove('drag');
    it.sc.spring(1, SP.release);
    const L = layoutSpec(rowSpec, S.mode === 'edit');
    if (L.pos.has(it.key)) it.x.spring(L.pos.get(it.key), SP.slide);
  }

  // ---------------------------------------------------------------- the handle, the stage, the dock
  hit.addEventListener('pointerdown', e => {
    if (e.button > 0 || S.home || S.mode !== 'handle') return;
    e.preventDefault();
    const p = toStage(e);
    bloom(p.x, p.y);
    openPill();
  });
  stage.addEventListener('pointerdown', e => {
    wakeHandle();
    if (e.target.closest('#sp-pill') || e.target.closest('#sp-split')) return;
    if (S.mode === 'edit') exitEdit();
    else if (S.mode === 'open' && S.content === 'pairs') closePill();
  }, true);
  stage.addEventListener('contextmenu', e => e.preventDefault());

  function dockUpdate() { splitIcon.classList.toggle('on', !S.home && !!(S.left || S.right)); }
  tapper(splitIcon, splitIcon.querySelector('svg'), () => dockSplit());

  function goHome() {
    if (S.home) return;
    S.home = true;
    clock.cancel(T.auto); clock.cancel(T.edit); clock.cancel(T.repair);
    pill.classList.remove('is-open');
    pill.classList.add('is-home');
    tw(P.vis, 0, M.hide);
    clock.cancel(T.homePill);
    T.homePill = later(() => {
      S.mode = 'handle';
      clearItems();
      P.w.set(HD.w); P.h.set(HD.h); P.o.set(0); P.rowA.set(0);
    }, D(TM.homeReset));
    SIDES.forEach(side => { const p = PANES[side]; p.tok++; dropFly(p); });
    tw(paneOpen, 0, GM.fold);
    tw(paneA, 0, GM.panesOut);
    tw(homeA, 1, GM.homeIn);
    dockUpdate();
  }
  function dockSplit() {
    if (S.home) {
      S.home = false;
      clock.cancel(T.homePill);
      SIDES.forEach(syncPane);
      S.mode = 'handle';
      clearItems();
      pill.classList.remove('is-open', 'is-home');
      P.w.set(HD.w); P.h.set(HD.h); P.o.set(0); P.rowA.set(0); P.hA.set(HD.alpha);
      tw(P.vis, 1, M.show);
      tw(paneOpen, 1, GM.unfold);
      tw(paneA, 1, GM.panesIn);
      tw(homeA, 0, GM.homeOut);
      dockUpdate();
      later(() => { if (!S.home) openPill(); }, D(TM.splitOpen));
      return;
    }
    if (S.mode === 'handle') openPill(); else pillTouched();
  }
  function toggleDetent() {
    S.detent ^= 1;
    tw(divX, DIV(), GM.detent);
    SIDES.forEach(relayPane);
  }
  function setDay(on) {
    S.day = !!on;
    ctlBtn('day').setAttribute('aria-pressed', String(S.day));
    SIDES.forEach(side => { const p = PANES[side]; if (p.cur && p.cur.app === 'nav') relayPane(side); });
  }
  function setBlur(on) {
    S.blur = !!on;
    stage.classList.toggle('blur', S.blur);
    ctlBtn('blur').setAttribute('aria-pressed', String(S.blur));
  }
  function standEvict() {
    if (S.home) return;
    let side = wideSide();
    if (!S[side]) side = side === 'left' ? 'right' : 'left';
    if (S[side]) emptyPane(side, 'evict');
  }
  function reset() {
    epoch++;
    Object.keys(T).forEach(k => clock.cancel(T[k]));
    const day = false;
    S = seed();
    S.day = day;
    fx.textContent = '';
    clearItems();
    pill.classList.remove('is-open', 'is-home');
    P.w.set(HD.w); P.h.set(HD.h); P.o.set(0); P.rowA.set(0); P.vis.set(1); P.hA.set(HD.alpha);
    divX.set(G.detents[0]); paneOpen.set(1); paneA.set(1); homeA.set(0);
    SIDES.forEach(side => {
      const p = PANES[side];
      p.tok++; p.fly = null; p.launching = false;
      p.contents.slice().forEach(r => drop(p, r));
      mount(side, S[side]);
    });
    setBlur(false);
    ctlBtn('day').setAttribute('aria-pressed', 'false');
    dockUpdate();
    startDim();
    markDirty();
  }

  // ---------------------------------------------------------------- the stand
  const ctl = $('#sp-ctl');
  const ctlBtn = act => ctl.querySelector(`[data-act="${act}"]`);
  const ACT = {
    evict: standEvict, home: goHome, detent: toggleDetent,
    day: () => setDay(!S.day), blur: () => setBlur(!S.blur), reset,
  };
  ctl.addEventListener('click', e => {
    const b = e.target.closest('button[data-act]');
    if (b && ACT[b.dataset.act]) ACT[b.dataset.act]();
  });

  window.__stand = {
    open: () => openPill(),
    close: () => closePill(),
    evict: standEvict,
    closePane: (side = 'right') => emptyPane(side, 'user'),
    edit: () => { if (S.mode === 'handle') openPill(); enterEdit(); },
    exitEdit: () => exitEdit(),
    day: (on = true) => setDay(on),
    night: () => setDay(false),
    blur: (on = true) => setBlur(on),
    home: goHome,
    split: dockSplit,
    detent: toggleDetent,
    plus: () => { const it = items.get('plus'); if (it) plusAction(it); },
    pin: () => { const it = items.get('star'); if (it) starAction(it); },
    choose: (i = 0) => { const it = [...items.values()].filter(x => x.kind === 'chip')[i]; if (it) tapItem(it); },
    reset,
    state: () => JSON.parse(JSON.stringify(S)),
  };

  // Boot.
  SIDES.forEach(side => mount(side, S[side]));
  dockUpdate();
  startDim();
  markDirty();

  // ---------------------------------------------------------------- frozen frames
  // `#bare-<board>`: a named state, settled, every animation held still. `#bare-<motion>-t<ms>`:
  // <ms> after a motion starts. Each runs the page's own code on the virtual clock from boot, at
  // 0 ms: a step list is actions and waits (ms), and the frame is drawn when the list ends. The
  // stage is alone at scale 1, 1280 x 800 at the window's top-left.
  if (BARE) {
    const chip = i => () => { const it = [...items.values()].filter(x => x.kind === 'chip')[i]; if (it) tapItem(it); };
    const day = () => setDay(true);
    const vacate = side => () => emptyPane(side, 'user');
    // The pair on screen made music | browser, so that the first pinned pair after it changes both panes.
    const browser = [openPill, 1200, chip(2), 2000];
    const BOARDS = {
      handle: [],
      'handle-dim': [TM.dim + M.dim.ms + 300],
      open: [openPill, 1200],
      'open-day': [day, 800, openPill, 1200],
      'open-browser': [...browser, openPill, 1200],
      'open-wide-left': [toggleDetent, 1000, openPill, 1200],
      'vacant-right': [vacate('right'), 2000],
      'vacant-left': [vacate('left'), 2000],
      'vacant-both': [vacate('right'), 2000, vacate('left'), 2000],
      edit: [openPill, 1200, () => enterEdit(), 1200],
      'edit-day': [day, 800, openPill, 1200, () => enterEdit(), 1200],
      launch: [...browser, openPill, 1200, chip(1), 900],
      home: [goHome, 1200],
      'blur-day': [() => setBlur(true), day, 800, openPill, 1200],
    };
    // A motion: the steps before it, then its start at t = 0.
    const MOTIONS = {
      opening: [[], () => {
        bloom(clamp(divX.v, PL.margin + HD.w / 2, (G.w - PL.margin) - HD.w / 2), HD.bottom - HD.h / 2);
        openPill();
      }],
      choosing: [[...browser, openPill, 1200], chip(1)],
      vacating: [[], vacate('right')],
    };
    const run = list => { let t = 0; for (const s of list) { if (typeof s === 'number') clock.to(t += s); else s(); } return t; };
    const [, name, at] = BARE;
    if (at === undefined && BOARDS[name]) {
      run(BOARDS[name]);
      // Boards hold the ghost's breathing at its brightest and a resting placeholder's ring at its
      // peak; a transition still running ends.
      clock.freeze(a => (a.animationName === 'sp-breathe' ? M.breathe.ms / 2
        : a.animationName === 'sp-ring' ? M.pulse.ms : a.effect.getComputedTiming().endTime));
    } else if (at !== undefined && MOTIONS[name]) {
      const [before, start] = MOTIONS[name];
      const t0 = run(before);
      clock.watch = true;
      start();
      clock.to(t0 + Number(at));
      clock.freeze();
    } else {
      console.error('split-pill: no board or motion called ' + name);
    }
  }

  // #stand=day,open runs stand helpers in order, for pinned screenshots.
  const m = /stand=([\w,]+)/.exec(location.hash);
  if (m) m[1].split(',').forEach((c, i) => setTimeout(() => { if (window.__stand[c]) window.__stand[c](); }, 250 + i * 600));
})();
</script>
