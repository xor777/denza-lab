<!doctype html>

<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#07080A; font-family:'Roboto','Segoe UI',system-ui,sans-serif; }
    a { color:#FEEFAB; } a:hover { color:#FFF7D2; }
    .card { background:#212429; border:1px solid #323538; border-radius:32px; box-sizing:border-box;
            display:flex; flex-direction:column; gap:20px; }
    .ttl { color:#DAE1EB; font-size:34px; font-weight:600; line-height:1.2; }
    .msg { color:#86909B; font-size:19px; line-height:1.263; }
    .row { display:flex; gap:12px; justify-content:flex-end; align-items:flex-start; }
    .btn { box-sizing:border-box; font-size:19px; font-weight:500; line-height:1.2;
           display:flex; align-items:center; justify-content:center; text-align:center; }
    .pill { min-height:40px; border-radius:20px; padding:8px 24px; }
    .fill { background:#FEEFAB; color:#262D33; }
    .edge { border:1px solid #FF9F19; color:#FF9F19; }
    /* Compose measures a Row's children in order: the first takes what it asks for and the
       second is handed the remainder, so the outlined action keeps its natural width and the
       primary one is squeezed into what is left. Flexbox would shrink both together. */
    .first { flex:0 0 auto; }
    .rest { flex:0 1 auto; min-width:64px; }
    .more { min-height:42px; border-radius:12px; border:1px solid #484E55; color:#FEEFAB;
            padding:8px 24px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block;
            text-align:center; line-height:26px; font-size:19px; font-weight:500; box-sizing:border-box; }
  </style>
</helmet>
<div style="width:416px; height:680px; box-sizing:border-box; background:#07080A; position:relative;">

      <div class="row">
        <div class="btn pill edge first">Восстановить ADB</div>
        <div class="btn pill fill rest">Я подтвердил — проверить</div>
      </div>
      <div class="more">Что такое ADB</div>

  </div>
</div>
