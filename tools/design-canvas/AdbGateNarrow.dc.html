<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@200;300;400;500;700&amp;display=swap" rel="stylesheet">
  <style>
    body { margin:0; background:#07080A; font-family:'Roboto','Segoe UI',system-ui,sans-serif; }
    a { color:#FEEFAB; } a:hover { color:#FFF7D2; }
    .card { background:#212429; border:1px solid #323538; border-radius:32px; box-sizing:border-box;
            display:flex; flex-direction:column; gap:20px; }
    .ttl { color:#DAE1EB; font-size:34px; font-weight:600; line-height:1.2; }
    .msg { color:#86909B; font-size:19px; line-height:1.263; }
    /* One action per line. A Row measured its children in order - the outlined one took the
       width it asked for and the primary one was handed the remainder - so at 312 dp of card the
       primary label ran out past both ends of its own pill. A card this narrow has room for one
       button on a line and no room for two, and the stack is read from the top, which is where
       the thing you came to press belongs. */
    .stack { display:flex; flex-direction:column; gap:12px; }
    .btn { box-sizing:border-box; font-size:19px; font-weight:500; line-height:26px;
           min-height:42px; border-radius:12px; padding:8px 24px; text-align:center;
           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .fill { background:#FEEFAB; color:#262D33; }
    .edge { border:1px solid #FF9F19; color:#FF9F19; }
    .more { border:1px solid #484E55; color:#FEEFAB; }
  </style>
</helmet>
<div style="width:416px; height:680px; box-sizing:border-box; background:#07080A; position:relative;">
  <div style="position:absolute; inset:0; background:rgba(0,0,0,0.78); box-sizing:border-box;
              padding:32px; display:flex; align-items:center; justify-content:center;">
    <div class="card" style="width:352px; padding:32px 20px;">
      <div style="display:flex; align-items:center; gap:20px;">
        <svg style="flex:0 0 auto;" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FF9F19" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
        <div class="ttl">Подтвердите доступ к ADB</div>
      </div>
      <div class="msg">Разрешите системный запрос на экране автомобиля</div>
      <div class="stack">
        <div class="btn fill">Я подтвердил — проверить</div>
        <div class="btn edge">Восстановить ADB</div>
        <div class="btn more">Что такое ADB</div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":416,"height":680}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
