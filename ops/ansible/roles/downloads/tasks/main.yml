---
- name: Install the download page web server without starting it
  ansible.builtin.apt:
    name: caddy
    state: present
    policy_rc_d: 101

- name: Create the download page directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: "0755"
  loop:
    - path: "{{ downloads_root }}"
      owner: root
    - path: "{{ downloads_root }}/fonts"
      owner: root
    - path: "{{ downloads_root }}/apk"
      owner: "{{ downloads_publisher }}"
  loop_control:
    label: "{{ item.path }}"

# APKs and releases.json are runtime content owned by platform/downloads/publish.py.
- name: Create an empty release list
  ansible.builtin.copy:
    dest: "{{ downloads_root }}/apk/releases.json"
    content: '{"apps": {}, "version": 1}'
    owner: "{{ downloads_publisher }}"
    group: "{{ downloads_publisher }}"
    mode: "0644"
    force: false

- name: Install the download page
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../platform/downloads/www/{{ item }}"
    dest: "{{ downloads_root }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - index.html
    - site.css
    - site.js

- name: Install the page fonts and their licences
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../tools/design-canvas/luminofor/fonts/{{ item }}"
    dest: "{{ downloads_root }}/fonts/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ downloads_fonts }}"

- name: Install the download page server configuration
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/caddy validate --adapter caddyfile --config %s
  notify: Restart download page web server

- name: Allow ACME and the HTTPS redirect through UFW
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp
    comment: Download page ACME and redirect

- name: Enable the download page web server
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
